<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risco de Incêndio · Gerenciamento Diário</title>
  <meta name="description" content="Risco diário de incêndio por local: risco, temperatura, umidade, vento e chuva.">
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="style.css?v=20261020a">
  <link rel="stylesheet" href="tema.css?v=20261020a">
  <link rel="stylesheet" href="incendio.css?v=20261020a">
</head>
<body class="auth-locked">

  <!-- ================= TOPO ================= -->
  <header class="topbar" id="topo">
    <div class="topbar__inner">
      <a class="brand" href="index.html" aria-label="Início">
        <span class="brand__logo">
          <img src="logo-icon.png" alt="" onerror="this.parentNode.classList.add('is-fallback'); this.remove();">
          <i class="fa-solid fa-seedling brand__fallback" aria-hidden="true"></i>
        </span>
        <span class="brand__text">
          <strong>Gerenciamento Diário</strong>
          <small>Centro de Operações Agrícolas</small>
        </span>
      </a>

      <nav class="pages" aria-label="Páginas">
        <a href="index.html"><i class="fa-solid fa-chart-column"></i><span>Operação diária</span></a>
        <a href="incendio.html" class="is-on" aria-current="page"><i class="fa-solid fa-fire"></i><span>Risco de incêndio</span></a>
      </nav>

      <div class="toolbar" role="toolbar" aria-label="Ações">
        <span class="report-chip" id="rfChip" title="Leitura carregada"><i class="fa-regular fa-clock"></i><span>—</span></span>
        <button class="btn btn--primary" id="rfImport" title="Importar a planilha Risco de Incêndio (.xlsm / .xlsx) e atualizar a página">
          <i class="fa-solid fa-file-excel"></i><span>Importar planilha</span>
        </button>
        <button class="btn" id="rfJson" title="Baixar incendio.json protegido (para publicar no GitHub)">
          <i class="fa-solid fa-file-code"></i><span>incendio.json</span>
        </button>
        <button class="btn" id="btnPrint" title="Imprimir / salvar em PDF">
          <i class="fa-solid fa-print"></i><span>Imprimir</span>
        </button>
        <button class="btn btn--icon" id="btnSair" title="Sair">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
        <input type="file" id="rfFile" accept=".xlsm,.xlsx,.xls,.csv,.json" hidden>
      </div>
    </div>

    <nav class="subnav" aria-label="Seções">
      <a href="#rfVisao" class="is-active">Visão geral</a>
      <a href="#rfLocais">Locais</a>
      <a href="#rfHora">Por hora</a>
    </nav>
  </header>

  <main class="container" id="rfApp">
    <div id="rfContent">
      <div class="card rf-empty"><i class="fa-solid fa-fire"></i><h3>Carregando…</h3></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__brand">
        <span class="brand__logo brand__logo--lg">
          <img src="logo.png" alt="" onerror="this.parentNode.classList.add('is-fallback'); this.remove();">
          <i class="fa-solid fa-seedling brand__fallback" aria-hidden="true"></i>
        </span>
        <div>
          <strong>Gerenciamento Diário · Risco de Incêndio</strong>
          <small id="rfFonte">Fonte: planilha Risco de Incêndio</small>
        </div>
      </div>
      <p class="copyright">© <span id="year">2026</span> Talamante. Todos os direitos reservados.</p>
    </div>
  </footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal__box">
      <header><h3 id="modalTitle">Importação</h3><button class="icon-btn" id="modalClose" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button></header>
      <div class="modal__body" id="modalBody"></div>
      <footer id="modalFoot"></footer>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="acesso.js?v=20261020a"></script>
  <script src="incendio.js?v=20261020a"></script>
</body>
</html>
